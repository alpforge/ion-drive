name: Build fork APK

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Public repository: the standard ubuntu-latest runner has 4 vCPU and 16 GB of RAM, enough for R8
  # with the 7 GB Gradle heap of gradle.properties.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout (full history and tags, used for versionCode)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The runner has 16 GB of RAM; without extra swap the R8 step gets the runner killed
      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile >/dev/null
          sudo swapon /mnt/swapfile
          free -h

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FORK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > fork.jks
            echo "FORK_KEYSTORE_FILE=fork.jks" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/heads/candidate/* ]]; then
            echo "::error::A candidate branch is published as a release: FORK_KEYSTORE_* secrets are required."
            exit 1
          else
            echo "::warning::No FORK_KEYSTORE_BASE64 secret: APK signed with a throwaway debug key, it will not install over a previous build."
          fi

      # The build prints ~1M lines of harmless D8 warnings: keep them in a log artifact, not in the job log
      - name: Build prod release APK
        env:
          FORK_KEYSTORE_PASSWORD: ${{ secrets.FORK_KEYSTORE_PASSWORD }}
          FORK_KEY_ALIAS: ${{ vars.FORK_KEY_ALIAS }}
          FORK_KEY_PASSWORD: ${{ secrets.FORK_KEY_PASSWORD }}
        run: |
          # Memory usage every minute in the job log, to see where it peaks
          ( while true; do free -m | awk -v t="$(date +%T)" '/Mem/{m=$3"/"$2} /Swap/{s=$3} END{print "memory " t ": " m " MB, swap " s " MB"}'; sleep 60; done ) &
          code=0
          # Fewer parallel workers and a capped Kotlin daemon keep the build within the runner's memory
          ./gradlew --console=plain --max-workers=2 -Pkotlin.daemon.jvmargs=-Xmx3g \
            :app:assembleProdRelease > build.log 2>&1 || code=$?
          grep -E '^e: |\berror:|^FAILURE|BUILD (SUCCESSFUL|FAILED)|actionable tasks' build.log |
            grep -v 'WARNING: D8' | tail -n 50 || true
          exit $code

      - name: Unit tests of the fork's revision upload
        run: ./gradlew --console=plain :drive:drivelink-upload:domain:testDebugUnitTest

      - name: Remove signing key
        if: always()
        run: rm -f fork.jks

      - uses: actions/upload-artifact@v4
        with:
          name: ion-drive-apk
          path: app/build/outputs/apk/prod/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log

  # candidate/<version> is pushed by the scheduled Claude routine after rebasing the fork onto a new
  # upstream tag. Once it builds, it becomes fork/<version> (same commit) and a GitHub pre-release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/heads/candidate/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check version
        run: |
          VERSION="${GITHUB_REF_NAME#candidate/}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Branch name must be candidate/X.Y.Z, got $GITHUB_REF_NAME"; exit 1
          fi
          if ! grep -q "versionName = \"$VERSION\"" buildSrc/src/main/kotlin/Config.kt; then
            echo "::error::Config.versionName does not match $VERSION"; exit 1
          fi
          if git ls-remote --exit-code origin "refs/heads/fork/$VERSION" >/dev/null; then
            echo "::error::fork/$VERSION already exists"; exit 1
          fi
          if git ls-remote --exit-code origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: ion-drive-apk
          path: apk

      - name: Create fork branch and pre-release
        run: |
          APK="ion-drive-$VERSION.apk"
          mv apk/*.apk "$APK"
          # The routine pushes the upstream tag, fall back to upstream if it is missing
          git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null ||
            git fetch https://github.com/ProtonDriveApps/android-drive.git "refs/tags/$VERSION:refs/tags/$VERSION"
          {
            echo "Ion Drive $VERSION: Proton Drive $VERSION with write access for other apps (see FORK.md)."
            echo
            echo "Pre-release built by CI from \`fork/$VERSION\`. Fork commits on top of upstream \`$VERSION\`:"
            echo
            git log --format='- %s' "$VERSION..$GITHUB_SHA"
          } > notes.md
          git push origin "$GITHUB_SHA:refs/heads/fork/$VERSION"
          gh release create "v$VERSION" "$APK" --target "$GITHUB_SHA" --prerelease \
            --title "$VERSION" --notes-file notes.md
          git push origin --delete "candidate/$VERSION"
